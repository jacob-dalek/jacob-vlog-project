<li class="list-row pt-5">

        <div class="p-6">


                        <div>
                                <h1 class="text-2xl card-title">Title: {{post.Title}}</h1>
                                <p class="mt-2 text-lg">Description: {{post.Description}}</p>
                        </div>

                        <div class="mx-1 text-xs pt-3">Created: {{post.created_at}}</div>
                        <div class="mx-1 text-xs">Updated: {{post.updated_at}}</div>
                        <div class="flex flex-col mt-6 space-y-3 lg:space-y-0 lg:flex-row">
                    <button hx-post="{% url 'update_post' post.pk %}"
                                hx-target="closest li" class="block px-5 py-2 text-sm font-medium tracking-wider text-center text-white transition-colors duration-300 transform bg-gray-900 rounded-md hover:bg-gray-700">Update</button>
                    <button  hx-delete="{% url 'delete_post' post.pk %}"
                                hx-confirm="Are you sure you want delete {{post.Title}}?" hx-swap="outerHTML"
                                hx-target="closest li" class="block px-5 py-2 text-sm font-medium tracking-wider text-center text-white transition-colors duration-300 transform bg-red-500 rounded-md lg:mx-4 hover:bg-red-400">Delete</button>
                </div>
        </div>
</li>
