{% extends 'base.html' %}

{% partialdef post_list %}



    {% include 'components/post_array.html'%}


{% endpartialdef %}

{% partialdef no_posts %}


    <section>
        <div class="container flex flex-col items-center px-4 py-12 mx-auto text-center">
            <h2 class="max-w-2xl mx-auto text-2xl font-semibold tracking-tight text-gray-800 xl:text-3xl">
                You have no posts
            </h2>

            <p class="max-w-4xl mt-6 text-center text-gray-500">
                <a class="link link-info" href="{% url 'create_post' %}">Click here to create new posts</a>
            </p>

        </div>
    </section>


{% endpartialdef %}

{% block content %}



<div class="container px-6 py-12 mx-auto">
    <div class="grid grid-cols-1 gap-8 md:grid-cols-2 lg:grid-cols-3">
        {% partial post_list %}

    </div>

</div>

{% endblock %}
