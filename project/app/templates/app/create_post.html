{% load formify %}

{% block content %}
<div class="w-full max-w-3xl mx-auto px-4">
  <form method="post">
    
    {% csrf_token %}

    {% render_form form %}
    
    {% render_submit text='Submit' css_class="bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded focus:outline-none focus:shadow-outline" %}
    
  </form>
</div>
{% endblock %}
